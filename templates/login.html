<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Face Recognition Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #2563eb;
            color: white;

            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            outline: none;
            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;
            border-radius: 8px;

            text-align: center;
            font-size: 14px;

            margin-bottom: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #9ca3af;
            font-size: 12px;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            🔐
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Face Recognition Attendance System
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/login">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text" id="username" name="username" placeholder="Enter username" required
                    autocomplete="username">

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Enter password" required
                    autocomplete="current-password">

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div class="footer">
            Admin access only
        </div>

    </div>

</body>

</html>
